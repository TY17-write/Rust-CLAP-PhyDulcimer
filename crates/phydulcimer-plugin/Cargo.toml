[package]
name = "phydulcimer-plugin"
description = "CLAP plugin front-end for PhyDulcimer (clack)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# CLAP プラグインは共有ライブラリ。`.clap` は cdylib をリネームしたもの。
# rlib も出しておくと統合テストから直接叩ける。
crate-type = ["cdylib", "rlib"]

[dependencies]
phydulcimer-core.workspace = true
clack-plugin.workspace = true
clack-extensions.workspace = true

# エディタ (Phase 9)。描画は phydulcimer-gui、ウィンドウの埋め込みは
# egui-baseview + raw-window-handle をこのクレートだけが持つ。
phydulcimer-gui.workspace = true
egui.workspace = true
egui-baseview.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
# CLAP ホスト側を自前で立てて、プラグインを ABI 経由で検証するため。
clack-host.workspace = true
# `process` のアロケーション 0 を機械的に保証する。
assert_no_alloc.workspace = true

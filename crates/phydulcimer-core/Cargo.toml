[package]
name = "phydulcimer-core"
description = "Real-time physical-modelling hammered dulcimer DSP core (allocation-free audio path)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# モーダル共振器を f32x8 で回す。stable Rust のまま SIMD が使える。
# ビルドは baseline (SSE2) のままなので、AVX が無い環境でも動く。
wide.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
# 音域バランスの回帰テスト (tests/register_balance.rs) が LUFS 測定に使う。
# analyze → core の依存は無いので循環しない。測定器は BS.1770 の規格テストで
# lib 側から固定されている (測定器の独立性は保ったまま実装を 1 つにする)。
phydulcimer-analyze = { path = "../../tools/analyze" }

[[bench]]
name = "dsp"
harness = false

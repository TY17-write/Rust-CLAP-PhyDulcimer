[workspace]
resolver = "2"
members = [
    "crates/phydulcimer-core",
    "tools/render",
    "tools/analyze",
]

# Phase 2 で `crates/phydulcimer-plugin`、Phase 9 で `crates/phydulcimer-gui` が
# ここに加わる。clack と egui の依存はそのときに足す — 使わないうちから
# 書いておくと、fetch とビルドの時間だけが増える。

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
phydulcimer-core = { path = "crates/phydulcimer-core" }

hound = "3.5"
approx = "0.5"

# SIMD。stable Rust のまま f32x8 が使える (Phase 8 で使う)。
wide = "0.7"

# ベンチ。既定機能に含まれる作図まわり (plotters / rayon) は要らないので切る。
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# DSP の実験は dev ビルドでも実時間で回したいので、依存クレートは最適化しておく。
[profile.dev.package."*"]
opt-level = 2

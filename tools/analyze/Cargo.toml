[package]
name = "phydulcimer-analyze"
description = "WAV analysis for PhyDulcimer: partial magnitudes, T60, fundamental estimation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# lib と bin に分けてある。解析器を bin の中に閉じ込めると `tests/` から
# 叩けない。参照音源を持たないプロジェクトでは測定器そのものの正しさが
# 唯一の足場なので、統合テストで固定できるよう lib として公開する。
[lib]
name = "phydulcimer_analyze"
path = "src/lib.rs"

[[bin]]
name = "phydulcimer-analyze"
path = "src/main.rs"

[dependencies]
hound.workspace = true

[dev-dependencies]
approx.workspace = true
